services:
  - type: web
    name: rg-saglik-takip
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: rgdata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RG_API_TOKEN
        generateValue: true
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
