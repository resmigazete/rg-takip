<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>RG Sağlık Takip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { color-scheme: light; --bg:#fff; --card:#fff; --ink:#14201f; --mut:#5b6b69; --brand:#0f766e; --line:#e3e8e7; --warn:#b45309; --sb:#be123c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink);
         padding-bottom: calc(104px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; }
  header .top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  header h1 { font-size:17px; margin:0; font-weight:650; }
  #searchBtn { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:10px; width:40px; height:36px; font-size:18px; flex:none; }
  .datebar { display:flex; align-items:center; gap:8px; }
  .datebar button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:10px; width:40px; height:36px; font-size:18px; }
  .datebar label { flex:1; min-width:0; display:flex; flex-direction:column; font-size:11px; opacity:.9; }
  .datebar input { width:100%; min-width:0; height:34px; border:0; border-radius:10px; padding:0 6px; font-size:14px; text-align:center; margin-top:2px; }
  .chips { display:flex; gap:6px; margin-top:8px; }
  .chips button { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:99px; padding:4px 12px; font-size:13px; }
  .chips button.on { background:#fff; color:var(--brand); font-weight:650; }
  .tag.sb { background:var(--sb); color:#fff; font-weight:650; }
  .card { position:relative; }
  .tags { padding-right:46px; }
  .share { position:absolute; top:10px; right:10px; width:36px; height:36px; padding:0; border:0; border-radius:50%;
           background:#25D366; display:flex; align-items:center; justify-content:center; }
  .share svg { width:21px; height:21px; fill:#fff; }
  .tag.d { background:transparent; border:1px solid var(--line); }
  main { padding:12px; }
  .card { --c:#64748b; --t1:#f8fafc; --t2:#e2e8f0; background:var(--t1); border:1px solid var(--t2); border-left:6px solid var(--c);
          border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .card.imp { background:var(--t2); border-color:var(--c); border-width:2px 2px 2px 8px; }
  .t-yonetmelik { --c:#2563eb; --t1:#eff6ff; --t2:#cfe0ff; }
  .t-ilan       { --c:#d97706; --t1:#fffaf0; --t2:#fde3b0; }
  .t-teblig     { --c:#7c3aed; --t1:#f6f2ff; --t2:#ddd0fb; }
  .t-kanun      { --c:#be185d; --t1:#fff1f7; --t2:#fbc9dd; }
  .t-atama      { --c:#0f766e; --t1:#effaf8; --t2:#bfeae4; }
  .t-diger      { --c:#64748b; --t1:#f8fafc; --t2:#dfe5ec; }
  .tag.tt { background:var(--c); color:#fff; font-weight:650; }
  .note { font-size:13px; color:var(--mut); background:#f1f5f4; border-radius:10px; padding:8px 10px; margin:0 0 10px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:12px; color:var(--mut); margin:0 2px 10px; align-items:center; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .legend .bold { font-weight:650; }
  .card a { color:inherit; text-decoration:none; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--line); color:var(--mut); margin-right:6px; }
  .tag.imp { background:var(--brand); color:#fff; }
  .title { font-weight:600; margin:6px 0 2px; }
  .mut { color:var(--mut); font-size:14px; }
  .chg { margin-top:6px; font-size:13px; color:var(--warn); }
  h2 { font-size:15px; margin:18px 4px 8px; color:var(--mut); font-weight:650; text-transform:uppercase; letter-spacing:.04em; }
  #bottom { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
            box-shadow:0 -2px 10px rgba(0,0,0,.07); padding-bottom:env(safe-area-inset-bottom); }
  nav { display:flex; gap:8px; padding:8px 10px 2px; }
  nav button { flex:1; border:1.5px solid var(--line); background:#f1f5f4; border-radius:14px; padding:7px 0 6px; font-size:13px;
               font-weight:650; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button .ic { font-size:22px; line-height:1; }
  nav button.on { background:var(--brand); border-color:var(--brand); color:#fff; }
  #foot { text-align:center; color:var(--mut); font-size:11px; padding:3px 8px 5px; }
  .empty { text-align:center; color:var(--mut); padding:40px 10px; }
  #q { width:100%; height:44px; border:1px solid var(--line); border-radius:12px; padding:0 12px; font-size:16px; background:var(--card); color:var(--ink); margin-bottom:10px; }
</style>
</head>
<body>
<header>
  <div class="top"><h1>🩺 Resmi Gazete · Sağlık Takip</h1><button id="searchBtn" aria-label="Ara">🔎</button></div>
  <div class="datebar" id="datebar">
    <button id="prev" aria-label="Önceki dönem">‹</button>
    <label>Başlangıç<input type="date" id="from"></label>
    <label>Bitiş<input type="date" id="to"></label>
    <button id="next" aria-label="Sonraki dönem">›</button>
  </div>
  <div class="chips" id="chips">
    <button data-n="1">Bugün</button><button data-n="7">Son 7 gün</button><button data-n="30">Son 30 gün</button>
  </div>
</header>
<main id="main"></main>
<div id="bottom">
  <nav>
    <button data-tab="health" class="on"><span class="ic">🩺</span>Sağlık</button>
    <button data-tab="related"><span class="ic">🏥</span>İlgili</button>
    <button data-tab="people"><span class="ic">👤</span>Atamalar</button>
    <button data-tab="other"><span class="ic">📄</span>Diğer</button>
  </nav>
  <div id="foot"></div>
</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND = {degisti:'değişti', eklendi:'eklendi', yururlukten_kalkti:'kaldırıldı'};
let tab = 'health', prevTab = 'health', searching = false, data = null, multi = false;

const APP_VERSION = '1.8.0', APP_DATE = '17.11.2026';
$('#foot').innerHTML = 'byRam ©ivelek · Sürüm ' + APP_VERSION + ' · ' + APP_DATE;

const STATIC = window.RG_MODE === 'static';
let searchIdx = null;
const trLower = s => s.replace(/İ/g, 'i').replace(/I/g, 'ı').toLowerCase();

async function getJSON(url, optional) {
  const r = await fetch(url);
  if (r.status === 404 && optional) return null;
  if (!r.ok) throw new Error('Veri alınamadı (' + r.status + ')');
  return r.json();
}

async function api(path) {
  if (STATIC) {
    if (path.startsWith('/api/day/')) {
      const d = path.split('/').pop();
      return (await getJSON('data/day/' + d + '.json', true)) || {date: d, missing: true, health: [], appointments: [], others: []};
    }
    if (path.startsWith('/api/search')) {
      const q = trLower(decodeURIComponent(path.split('q=')[1] || '').trim());
      if (!searchIdx) searchIdx = await getJSON('data/search.json');
      const has = (...f) => f.some(x => trLower(x || '').includes(q));
      return {
        items: searchIdx.items.filter(i => has(i.title)).slice(0, 50),
        appointments: searchIdx.appointments.filter(a => has(a.person, a.institution)).slice(0, 50)
      };
    }
    throw new Error('Bilinmeyen istek');
  }
  const tok = localStorage.getItem('rg_token') || '';
  const r = await fetch(path, {headers: tok ? {Authorization: 'Bearer ' + tok} : {}});
  if (r.status === 401) {
    const t = prompt('Erişim anahtarını gir:');
    if (t) { localStorage.setItem('rg_token', t); return api(path); }
    throw new Error('yetkisiz');
  }
  if (!r.ok) throw new Error('Sunucu hatası ' + r.status);
  return r.json();
}

function today() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
const MAX_DAYS = 31;
let latest = today();
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const dayCount = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5) + 1;
const trDate = iso => iso.split('-').reverse().join('.');
function range() {
  let a = $('#from').value || $('#to').value || latest, b = $('#to').value || a;
  if (a > b) [a, b] = [b, a];
  if (dayCount(a, b) > MAX_DAYS) a = addDays(b, -(MAX_DAYS - 1));
  return [a, b];
}
function setRange(a, b) { $('#from').value = a; $('#to').value = b; markChip(); load(); }
function shift(dir) { const [a, b] = range(), n = dayCount(a, b); setRange(addDays(a, dir * n), addDays(b, dir * n)); }
function markChip() {
  const [a, b] = range(), n = dayCount(a, b);
  document.querySelectorAll('#chips button').forEach(x => x.classList.toggle('on', b === latest && +x.dataset.n === n));
}

// Sağlık Bakanlığı ile ilgili mi? (yayımlayan kurum, başlık ya da sınıflandırma kategorisi)
const isSB = i => /sağlık bakanlığ|sağlık enstitüleri|tüseb|tuseb|ushaş|uluslararası sağlık hizmetleri|ilaç ve tıbbi cihaz kurum|titck|hudut ve sahiller sağlık/.test(trLower((i.issuer || '') + ' ' + (i.title || ''))) || (i.categories || []).includes('saglik_bakanligi');

const WA_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
const shareBtn = (text, url) =>
  `<button class="share" aria-label="WhatsApp'ta paylaş" title="WhatsApp'ta paylaş" data-text="${esc('📰 ' + text)}" data-url="${esc(url)}">${WA_SVG}</button>`;

const TCLS = {yonetmelik:'yonetmelik', ilan:'ilan', teblig:'teblig', kanun:'kanun', khk:'kanun', cb_kararname:'kanun',
              cb_karari:'kanun', atama:'atama'};
const tcls = t => 't-' + (TCLS[t] || 'diger');
const LEGEND = '<div class="legend"><span><i style="background:#2563eb"></i>Yönetmelik</span><span><i style="background:#d97706"></i>İlan</span>' +
  '<span><i style="background:#7c3aed"></i>Tebliğ</span><span><i style="background:#be185d"></i>Kanun/Karar</span>' +
  '<span><i style="background:#64748b"></i>Diğer</span><span class="bold">Koyu zemin + kalın çerçeve = önemli</span></div>';

function itemCard(i) {
  const chg = (i.amendments || []).map(a => `${esc(a.article_ref)} (${KIND[a.change_kind] || ''})`).join(', ');
  const sb = isSB(i);
  return `<div class="card ${tcls(i.type)}${i.importance >= 60 ? ' imp' : ''}"><a href="${esc(i.url)}" target="_blank" rel="noopener">
    <div class="tags">${multi && i.date ? `<span class="tag d">${trDate(i.date)}</span>` : ''}<span class="tag tt">${esc(i.type_label)}</span>${sb ? '<span class="tag sb">Sağlık Bakanlığı</span>' : ''}</div>
    <div class="title">${esc(i.title)}</div>
    ${i.issuer ? `<div class="mut">${esc(i.issuer)}</div>` : ''}
    ${chg ? `<div class="chg">Değişen: ${chg}</div>` : ''}</a>
    ${shareBtn(i.title + (i.issuer ? '\n' + i.issuer : ''), i.url)}</div>`;
}
function appCard(a) {
  const verb = a.action === 'gorevden_alma' ? 'görevden alındı' : 'atandı';
  const icon = {Vali:'🏛', 'Rektör':'🎓'}[a.new_role] || '•';
  return `<div class="card t-atama${a.is_health ? ' imp' : ''}"><a href="${esc(a.url)}" target="_blank" rel="noopener">
    <div class="tags">${multi && a.date ? `<span class="tag d">${trDate(a.date)}</span>` : ''}<span class="tag">${icon} ${esc(a.new_role || 'Görev')}</span>${a.is_health ? '<span class="tag imp">Sağlık</span>' : ''}</div>
    <div class="title">${esc(a.institution)}</div>
    <div>${esc(a.person)} ${verb}</div>
    ${a.predecessor ? `<div class="mut">Yerine: ${esc(a.predecessor)}</div>` : ''}</a>
    ${shareBtn(a.person + ' ' + verb + ' — ' + a.institution, a.url)}</div>`;
}
const list = (arr, fn, empty) => arr.length ? arr.map(fn).join('') : `<div class="empty">${empty}</div>`;

function render() {
  const m = $('#main');
  if (searching) return;
  if (!data) { m.innerHTML = '<div class="empty">Yükleniyor…</div>'; return; }
  if (data.missing) { m.innerHTML = '<div class="empty">Seçilen tarih aralığında kayıt yok.<br>Veriler takibin başladığı günden itibaren birikir.</div>'; return; }
  if (tab === 'health') m.innerHTML = LEGEND + list(data.health.filter(isSB), itemCard, 'Bu aralıkta Sağlık Bakanlığı ile ilgili kayıt yok.');
  if (tab === 'related') m.innerHTML = '<div class="note">Sağlıkla ilgili ama Sağlık Bakanlığı\'na doğrudan bağlı olmayan kayıtlar (üniversite hastaneleri, sağlık bilimleri üniversiteleri, diğer kurumlar vb.)</div>' +
    LEGEND + list(data.health.filter(i => !isSB(i)), itemCard, 'Bu aralıkta ilgili kayıt yok.');
  if (tab === 'people') {
    const key = data.appointments.filter(a => a.is_health || a.is_key_role), rest = data.appointments.filter(a => !(a.is_health || a.is_key_role));
    m.innerHTML = '<h2>Öne çıkanlar</h2>' + list(key, appCard, 'Öne çıkan atama yok.') + (rest.length ? '<h2>Diğer atamalar</h2>' + rest.map(appCard).join('') : '');
  }
  if (tab === 'other') m.innerHTML = LEGEND + list(data.others, itemCard, 'Kayıt yok.');
}

async function load() {
  data = null; render();
  const [a, b] = range();
  $('#from').value = a; $('#to').value = b; markChip();
  multi = a !== b;
  const days = [];
  for (let d = b; d >= a; d = addDays(d, -1)) days.push(d);   // yeniden eskiye
  try {
    const res = await Promise.all(days.map(d => api('/api/day/' + d).then(r => ({d, r}))));
    const out = {health: [], appointments: [], others: [], missing: true};
    for (const {d, r} of res) {
      if (r.missing) continue;
      out.missing = false;
      const stamp = x => ({...x, date: x.date || d});
      out.health.push(...r.health.map(stamp));
      out.appointments.push(...r.appointments.map(stamp));
      out.others.push(...r.others.map(stamp));
    }
    data = out; render();
  } catch (e) { $('#main').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function searchUI() {
  $('#datebar').style.display = 'none'; $('#chips').style.display = 'none';
  $('#main').innerHTML = '<input id="q" type="search" placeholder="Kişi, kurum veya konu ara…" autofocus><div id="res"></div>';
  let t;
  $('#q').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(async () => {
      const q = e.target.value.trim(); if (q.length < 2) { $('#res').innerHTML = ''; return; }
      try {
        const r = await api('/api/search?q=' + encodeURIComponent(q));
        $('#res').innerHTML =
          (r.appointments.length ? '<h2>Atamalar</h2>' + r.appointments.map(a => appCard({...a, predecessor: '', is_health: 0})).join('') : '') +
          (r.items.length ? '<h2>Düzenlemeler</h2>' + r.items.map(itemCard).join('') : '') ||
          '<div class="empty">Sonuç yok.</div>';
      } catch (err) { $('#res').innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
    }, 300);
  });
}

const setNav = t => document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
function exitSearch() { searching = false; $('#searchBtn').textContent = '🔎'; $('#datebar').style.display = ''; $('#chips').style.display = ''; }
$('#searchBtn').onclick = () => {
  if (searching) { exitSearch(); tab = prevTab; setNav(tab); render(); return; }
  prevTab = tab; searching = true; $('#searchBtn').textContent = '✕';
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  searchUI();
};
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  exitSearch(); tab = b.dataset.tab; setNav(tab); render();
});
document.addEventListener('click', e => {
  const b = e.target.closest('.share'); if (!b) return;
  window.open('https://wa.me/?text=' + encodeURIComponent(b.dataset.text + '\n' + b.dataset.url), '_blank', 'noopener');
});
$('#prev').onclick = () => shift(-1); $('#next').onclick = () => shift(1);
$('#from').onchange = () => { if ($('#to').value < $('#from').value) $('#to').value = $('#from').value; load(); };
$('#to').onchange = () => { if ($('#from').value > $('#to').value) $('#from').value = $('#to').value; load(); };
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => setRange(addDays(latest, -(+b.dataset.n - 1)), latest));
(async () => {
  if (STATIC) {
    try {
      const days = await getJSON('data/days.json', true);
      if (days && days.length) latest = days[0].date;
    } catch (e) {}
  }
  setRange(latest, latest);
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
