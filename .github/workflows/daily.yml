name: Günlük Resmi Gazete takibi

on:
  schedule:
    # 00:07, 00:27, 00:47, 01:07 (TR). GitHub zamanlanmış görevleri geç başlatabilir; ilk başlayan günü işler,
    # sonrakiler "zaten işlendi" diyip sessizce biter (brifing yeniden gönderilmez).
    - cron: "7 21 * * *"
    - cron: "27 21 * * *"
    - cron: "47 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-AA-GG). Boş bırakırsan bugün."
        required: false
      backfill_days:
        description: "Geçmişe dönük kaç gün doldurulsun (örn. 7). Boş bırakırsan yalnızca bugün."
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: rg-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RG_DB: data/rgtakip.sqlite3
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdir -p data

      - name: Testler
        run: python -m pytest -q

      - name: Geçmiş günleri doldur
        if: ${{ github.event.inputs.backfill_days != '' }}
        run: |
          N="${{ github.event.inputs.backfill_days }}"
          case "$N" in (*[!0-9]*) echo "Sayı girin"; exit 1;; esac
          if [ "$N" -gt 30 ]; then N=30; fi
          for i in $(seq "$N" -1 1); do
            D=$(TZ=Europe/Istanbul date -d "$i days ago" +%F)
            python main.py run --date "$D" --no-wait --no-send --force || echo "$D alınamadı"
          done

      - name: Sayıyı bekle, işle, brifingi gönder
        run: |
          D="${{ github.event.inputs.date }}"
          F=""
          if [ -z "$D" ]; then D=$(TZ=Europe/Istanbul date +%F); else F="--force"; fi
          python main.py run --date "$D" $F

      - name: Statik siteyi üret
        run: python -m rgtakip.export

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "rg-takip-bot"
          git config user.email "rg-takip-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellemesi $(TZ=Europe/Istanbul date +%F)"
            git push
          fi

      - name: Pages yayınını tetikle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
