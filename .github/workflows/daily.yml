name: Günlük Resmi Gazete takibi

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-AA-GG). Boş bırakırsan bugün."
        required: false

permissions:
  contents: write

concurrency:
  group: rg-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      RG_DB: data/rgtakip.sqlite3
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: mkdir -p data

      - name: Testler
        run: python -m pytest -q

      - name: Sayıyı bekle, işle, brifingi gönder
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Europe/Istanbul date +%F); fi
          python main.py run --date "$D"

      - name: Statik siteyi üret
        run: python -m rgtakip.export

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "rg-takip-bot"
          git config user.email "rg-takip-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellemesi $(TZ=Europe/Istanbul date +%F)"
            git push
          fi
